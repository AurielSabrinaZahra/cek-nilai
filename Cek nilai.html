<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penentu Nilai</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Poppins',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);margin:0}
  .card{background:#fff;padding:32px;border-radius:20px;width:380px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.3)}
  h2{margin:0} .sub{color:#888;font-size:12px;margin:8px 0 18px}
  input{width:100%;padding:14px;border:2px solid #eee;border-radius:12px;font-size:16px;outline:none;text-align:center}
  input:focus{border-color:#764ba2}
  button{width:100%;padding:14px;margin-top:14px;border:none;border-radius:12px;background:#764ba2;color:#fff;font-weight:600;font-size:16px;cursor:pointer}
  button:hover{background:#5a3d8a}
  #hasil{margin-top:20px;padding:18px;border-radius:14px;font-weight:600;display:none;line-height:1.6}
  .grade-A{background:#e8f5e9;color:#1b5e20;border:2px solid #4caf50}
  .grade-B{background:#e3f2fd;color:#0d47a1;border:2px solid #2196f3}
  .grade-C{background:#fff8e1;color:#f57f17;border:2px solid #ffc107}
  .grade-D{background:#ffebee;color:#b71c1c;border:2px solid #f44336}
  .err{background:#ffebee;color:#c62828;border:2px solid #f44336;display:block}
</style>
</head>
<body>

<div class="card">
  <h2>Penentu Nilai</h2>
  <p class="sub">90-100 = A | 80-89 = B | 70-79 = C | <70 = D</p>
  
  <input type="number" id="nilai" placeholder="Masukkan nilai 0-100">
  <button onclick="cekNilai()">Cek Hasil</button>
  
  <div id="hasil"></div>
</div>

<script>
function cekNilai(){
  let input = document.getElementById("nilai").value;
  let out = document.getElementById("hasil");

  if(input === ""){
    out.style.display="block";
    out.className="err";
    out.innerHTML="Masukkan nilai antara 0 sampai 100!";
    return;
  }

  let nilai = Number(input);

  if(nilai < 0 || nilai > 100 || isNaN(nilai)){
    out.style.display="block";
    out.className="err";
    out.innerHTML="Masukkan nilai antara 0 sampai 100!";
    return;
  }

  let huruf, ket;

  if(nilai >= 90){
    huruf = "A";
  } else if(nilai >= 80){
    huruf = "B";
  } else if(nilai >= 70){
    huruf = "C";
  } else {
    huruf = "D";
  }

  switch(huruf){
    case "A": ket = "Sangat Baik"; break;
    case "B": ket = "Baik"; break;
    case "C": ket = "Cukup"; break;
    default: ket = "Perlu belajar lagi"; break;
  }

  out.style.display="block";
  out.className = "grade-" + huruf;
  out.innerHTML = `
    Nilai Kamu: <b style="font-size:22px">${nilai}</b><br>
    Grade: <b style="font-size:22px">${huruf}</b><br>
    Keterangan: <b>${ket}</b>
  `;
}
</script>

</body>
</html>
